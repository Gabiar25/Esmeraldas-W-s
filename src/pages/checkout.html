<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Finalizar compra — Esmeraldas W&S</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="page-loader" id="pageLoader" aria-hidden="true">
  <img src="/assets/logo/loader-icon.png" alt="" width="130">
</div>
<script>
(function () {
  var el = document.getElementById("pageLoader");
  var alreadyShown = true;
  try {
    alreadyShown = sessionStorage.getItem("loaderShown") === "1";
    sessionStorage.setItem("loaderShown", "1");
  } catch (e) {
    alreadyShown = false;
  }
  if (alreadyShown) {
    if (el) el.remove();
    return;
  }
  var shownAt = Date.now();
  var MIN_MS = 500;
  var MAX_MS = 4000;
  function hideLoader() {
    if (!el || el.dataset.hidden) return;
    el.dataset.hidden = "1";
    el.classList.add("is-hidden");
    setTimeout(function () { el.remove(); }, 500);
  }
  function scheduleHide() {
    setTimeout(hideLoader, Math.max(0, MIN_MS - (Date.now() - shownAt)));
  }
  if (document.readyState === "complete") scheduleHide();
  else window.addEventListener("load", scheduleHide);
  setTimeout(hideLoader, MAX_MS);
})();
</script>

<!--include:header-minimal-->

<main class="container">
  <div class="page-header" style="padding-block:2rem 0;">
    <p class="eyebrow">Paso final</p>
    <h1>Finalizar compra</h1>
  </div>

  <div class="checkout-grid">
    <div>
      <form id="checkoutForm" novalidate>
        <div class="form-section reveal" style="--d:0s">
          <h2>Contacto</h2>
          <div class="field">
            <input type="email" id="email" name="email" autocomplete="email" placeholder=" " required>
            <label for="email">Correo electrónico</label>
            <div class="field-error" data-error-for="email"></div>
          </div>
        </div>

        <div class="form-section reveal" style="--d:.06s">
          <h2>Entrega</h2>
          <div class="field field--select">
            <label for="country">País / Región</label>
            <select id="country" disabled>
              <option value="Colombia">Colombia</option>
            </select>
          </div>
          <div class="form-row">
            <div class="field">
              <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder=" " required>
              <label for="firstName">Nombre</label>
              <div class="field-error" data-error-for="firstName"></div>
            </div>
            <div class="field">
              <input type="text" id="lastName" name="lastName" autocomplete="family-name" placeholder=" " required>
              <label for="lastName">Apellidos</label>
              <div class="field-error" data-error-for="lastName"></div>
            </div>
          </div>
          <div class="field">
            <input type="text" id="docNumber" name="docNumber" placeholder=" " required>
            <label for="docNumber">Cédula o Nit</label>
            <div class="field-error" data-error-for="docNumber"></div>
          </div>
          <div class="field">
            <input type="text" id="address" name="address" autocomplete="street-address" placeholder=" " required>
            <label for="address">Dirección</label>
            <div class="field-error" data-error-for="address"></div>
          </div>
          <div class="field">
            <input type="text" id="address2" name="address2" autocomplete="address-line2" placeholder=" ">
            <label for="address2">Casa, apartamento, etc. (opcional)</label>
          </div>
          <div class="form-row form-row--3">
            <div class="field field--select">
              <label for="department">Departamento</label>
              <select id="department" name="department" autocomplete="address-level1" required>
                <option value="">Selecciona…</option>
                <option value="Amazonas">Amazonas</option>
                <option value="Antioquia">Antioquia</option>
                <option value="Arauca">Arauca</option>
                <option value="Atlántico">Atlántico</option>
                <option value="Bogotá D.C.">Bogotá D.C.</option>
                <option value="Bolívar">Bolívar</option>
                <option value="Boyacá">Boyacá</option>
                <option value="Caldas">Caldas</option>
                <option value="Caquetá">Caquetá</option>
                <option value="Casanare">Casanare</option>
                <option value="Cauca">Cauca</option>
                <option value="Cesar">Cesar</option>
                <option value="Chocó">Chocó</option>
                <option value="Córdoba">Córdoba</option>
                <option value="Cundinamarca">Cundinamarca</option>
                <option value="Guainía">Guainía</option>
                <option value="Guaviare">Guaviare</option>
                <option value="Huila">Huila</option>
                <option value="La Guajira">La Guajira</option>
                <option value="Magdalena">Magdalena</option>
                <option value="Meta">Meta</option>
                <option value="Nariño">Nariño</option>
                <option value="Norte de Santander">Norte de Santander</option>
                <option value="Putumayo">Putumayo</option>
                <option value="Quindío">Quindío</option>
                <option value="Risaralda">Risaralda</option>
                <option value="San Andrés y Providencia">San Andrés y Providencia</option>
                <option value="Santander">Santander</option>
                <option value="Sucre">Sucre</option>
                <option value="Tolima">Tolima</option>
                <option value="Valle del Cauca">Valle del Cauca</option>
                <option value="Vaupés">Vaupés</option>
                <option value="Vichada">Vichada</option>
              </select>
              <div class="field-error" data-error-for="department"></div>
            </div>
            <div class="field field--select">
              <label for="city">Ciudad</label>
              <select id="city" name="city" autocomplete="address-level2" required disabled>
                <option value="">Elige un departamento primero</option>
              </select>
              <div class="field-error" data-error-for="city"></div>
            </div>
            <div class="field">
              <input type="text" id="postalCode" name="postalCode" autocomplete="postal-code" placeholder=" ">
              <label for="postalCode">Código postal (opcional)</label>
            </div>
          </div>
          <div class="field" id="cityOtherField" hidden>
            <input type="text" id="cityOther" name="cityOther" placeholder=" ">
            <label for="cityOther">Escribe tu ciudad o municipio</label>
          </div>
          <div class="field field--phone">
            <input type="tel" id="phone" name="phone" autocomplete="tel" placeholder=" " required>
            <label for="phone">Teléfono (WhatsApp)</label>
            <span class="field__flag" title="Colombia (+57)">
              <svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="1" fill="#FCD116"/><rect y="1" width="3" height="0.5" fill="#003893"/><rect y="1.5" width="3" height="0.5" fill="#CE1126"/></svg>
              +57
            </span>
            <div class="field-error" data-error-for="phone"></div>
          </div>

          <label class="field-checkbox">
            <input type="checkbox" id="saveInfo">
            <span>Guardar mi información y completar más rápido la próxima vez</span>
          </label>
          <label class="field-checkbox">
            <input type="checkbox" id="smsOptIn">
            <span>Enviarme novedades y ofertas por SMS</span>
          </label>
        </div>

        <div class="form-section reveal" style="--d:.12s">
          <h2>Método de entrega</h2>

          <label class="payment-option">
            <input type="radio" name="deliveryMethod" value="shipping" checked>
            <span class="payment-option__radio"></span>
            <span class="payment-option__row">
              <span class="payment-option__label">Envío a domicilio</span>
              <span id="shippingMethodCost">Según tu departamento</span>
            </span>
          </label>

          <label class="payment-option">
            <input type="radio" name="deliveryMethod" value="pickup" id="pickupRadio">
            <span class="payment-option__radio"></span>
            <span class="payment-option__row">
              <span class="payment-option__label">Retiro en oficina</span>
              <span>Gratis</span>
            </span>
            <span class="payment-option__hint">Cra. 6 # 12C-44, La Candelaria, Bogotá D.C. Disponible para recoger 1 día hábil después de la compra y la verificación del pago.</span>
          </label>
        </div>

        <div class="form-section reveal" style="--d:.18s">
          <h2>Pago</h2>
          <p class="payment-security-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            Todas las transacciones son seguras y están encriptadas.
          </p>

          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="card" checked>
            <span class="payment-option__radio"></span>
            <span class="payment-option__row">
              <span class="payment-option__label">Tarjeta de crédito y débito, PSE, Nequi, Bancolombia, Davivienda y más</span>
              <span class="payment-badges">
                <span class="card-badge card-badge--visa">VISA</span>
                <span class="card-badge card-badge--mc"><em></em><em></em></span>
                <span class="card-badge card-badge--amex">AMEX</span>
                <span class="card-badge card-badge--pse">PSE</span>
                <span class="card-badge card-badge--nequi">Nequi</span>
              </span>
            </span>
            <span class="payment-option__hint">Se abre la ventana segura de Wompi, donde eliges tarjeta, PSE, Nequi u otro medio de pago. Nosotros nunca vemos ni guardamos tus datos.</span>
          </label>

          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="cod" id="codRadio">
            <span class="payment-option__radio"></span>
            <span class="payment-option__row">
              <span class="payment-option__label">Pago contra entrega</span>
            </span>
            <span class="payment-option__hint" id="codHint">Pagas en efectivo o transferencia cuando recibas tu pedido. Te contactamos por WhatsApp para coordinar.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-block" id="payBtn">Pagar ahora</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>

    <aside class="order-summary">
      <h2>Resumen del pedido</h2>
      <div id="summaryItems"></div>
      <div class="summary-line"><span>Subtotal</span><span id="summarySubtotal">$0</span></div>
      <div class="summary-line">
        <span class="summary-line__label">Envío <span class="tooltip-icon" title="Se calcula según tu departamento de entrega">?</span></span>
        <span id="summaryShipping">$0</span>
      </div>
      <div class="summary-total">
        <span>Total</span>
        <span class="summary-total__amount"><small>COP</small><span id="summaryTotal">$0</span></span>
      </div>
    </aside>
  </div>
</main>

<!--include:footer-minimal-->

<!--include:cart-drawer-->

<script src="/js/utils.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
