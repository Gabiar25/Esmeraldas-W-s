<script>
(function () {
  var el = document.getElementById("pageLoader");
  var alreadyShown = true;
  try {
    alreadyShown = sessionStorage.getItem("loaderShown") === "1";
    sessionStorage.setItem("loaderShown", "1");
  } catch (e) {
    alreadyShown = false;
  }
  if (alreadyShown) {
    if (el) el.remove();
    return;
  }
  var shownAt = Date.now();
  var MIN_MS = 500;
  var MAX_MS = 4000;
  function hideLoader() {
    if (!el || el.dataset.hidden) return;
    el.dataset.hidden = "1";
    el.classList.add("is-hidden");
    setTimeout(function () { el.remove(); }, 500);
  }
  function scheduleHide() {
    setTimeout(hideLoader, Math.max(0, MIN_MS - (Date.now() - shownAt)));
  }
  if (document.readyState === "complete") scheduleHide();
  else window.addEventListener("load", scheduleHide);
  setTimeout(hideLoader, MAX_MS);
})();
</script>
