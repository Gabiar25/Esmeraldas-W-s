<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel de pedidos — Esmeraldas W&S</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>

<div id="loginBox" class="admin-login">
  <img src="/assets/logo/logo-horizontal-header.png" alt="Esmeraldas W&S" class="admin-login__logo">
  <h1>Panel de pedidos</h1>
  <p>Ingresa la clave para continuar.</p>
  <input type="password" id="adminPassword" placeholder="Clave" autocomplete="off">
  <button class="btn btn-block" id="loginBtn">Entrar</button>
  <p class="form-msg error" id="loginError"></p>
</div>

<div id="dashboard" hidden>
  <header class="admin-header">
    <img src="/assets/logo/logo-horizontal-header.png" alt="Esmeraldas W&S" class="admin-header__logo">
    <span class="admin-header__title">Panel de pedidos</span>
    <button class="admin-link-btn" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main class="admin-main">
    <div class="admin-stats" id="statsRow"></div>

    <div class="admin-toolbar">
      <input type="search" id="searchInput" placeholder="Buscar por cliente o número de pedido…">
      <select id="statusFilter">
        <option value="">Todos los estados</option>
        <option value="PENDING">Pendientes</option>
        <option value="FULFILLED">Entregados</option>
        <option value="CANCELLED">Cancelados</option>
      </select>
      <select id="methodFilter">
        <option value="">Todos los métodos</option>
        <option value="cod">Contra entrega</option>
        <option value="card">Tarjeta</option>
      </select>
      <button class="btn btn-outline" id="refreshBtn">Actualizar</button>
      <button class="btn btn-outline" id="exportBtn">Exportar CSV</button>
    </div>

    <div id="ordersContent"></div>
  </main>
</div>

<script src="/js/utils.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
