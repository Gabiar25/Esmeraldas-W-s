<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pedidos — Esmeraldas W&S</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<style>
  .admin-page { padding-block: 2.5rem; }
  .admin-login { max-width: 360px; margin: 4rem auto; text-align: center; }
  .admin-login input { width: 100%; margin-block: 1rem; }
  .admin-table-wrap { overflow-x: auto; }
  table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.admin-table th, table.admin-table td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--color-line); white-space: nowrap; }
  table.admin-table th { color: var(--color-ink-soft); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.06em; }
  .admin-status { padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
  .admin-status--pending { background: #f0ead9; color: #7a5f35; }
  .admin-status--approved { background: #e2ede2; color: #3f6b46; }
  .admin-status--declined { background: #f3ddd8; color: #b3402f; }
  .admin-wa { color: var(--color-success); text-decoration: underline; }
  .admin-empty { text-align: center; color: var(--color-ink-soft); padding: 3rem 0; }
  .admin-refresh { margin-bottom: 1.25rem; }
</style>
</head>
<body>

<main class="container admin-page">
  <div id="loginBox" class="admin-login">
    <h1>Pedidos</h1>
    <p>Ingresa la clave para ver los pedidos.</p>
    <input type="password" id="adminPassword" placeholder="Clave" autocomplete="off">
    <button class="btn" id="loginBtn">Entrar</button>
    <p class="form-msg error" id="loginError"></p>
  </div>

  <div id="ordersBox" hidden>
    <div class="page-header" style="padding-block:0 1rem;">
      <h1>Pedidos</h1>
    </div>
    <button class="btn btn-outline admin-refresh" id="refreshBtn">Actualizar</button>
    <div id="ordersContent"></div>
  </div>
</main>

<script src="/js/utils.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
